# ESP32 libcoap wolfSSL Configuration

# Core System
CONFIG_NEWLIB_LIBC=y
CONFIG_POSIX_API=y
CONFIG_XOPEN_STREAMS=y

# Memory — tuned for PQC (ML-KEM-512 / ML-DSA-44) + DTLS 1.3 within ESP32 DRAM.
# wolfSSL_new() needs ~30-40 KB for DTLS 1.3; wolfSSL_connect() needs additional
# buffers for handshake construction, key gen, output record.
# ML-DSA-44 certificates (~5.6 KB each) require DTLS fragment reassembly buffers
# of ~12 KB, so 98304 (96 KB) provides sufficient headroom.
# NOTE: ML-DSA-44 dilithium_verify_mu needs an 8104-byte XMALLOC during cert
# verification, and then AllocKey needs ~4200 bytes for peer dilithium_key.
# ML-DSA-44 handshake peaks at ~95 KB sys_heap; we need enough headroom so that
# allocations during + after ConfirmSignature (cert verify callback, key decode,
# etc.) don't fail.  Transfer 8 KB from stacks → sys_heap:
#   main stack: 20480 → 12288 (measured peak call depth 22 frames; with
#               WOLFSSL_SMALL_STACK, large arrays go to heap; 12 KB is ample)
#   workqueue: 2048 → 1024   idle: 2048 → 1024
# NOTE: ML-KEM-768/1024 certificates may still exceed ESP32 heap headroom.
# ML-KEM-512 + cert-verify peaks at 70,436 bytes allocated; with 104,448 pool
# fragmentation after ~14 iterations causes OOM.  Add 3 KB from DRAM headroom.
CONFIG_MAIN_STACK_SIZE=12288
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=107520

# Debugging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_ASSERT=n

# Heap runtime statistics — tracks allocated, free, and peak usage
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Hardware
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_GPIO=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y

# Network Stack
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_DHCPV4=y

# Network Management
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# WiFi Configuration
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y

# -------- MbedTLS (required by ESP32 WiFi driver, NOT the app TLS backend) --------
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=4096
CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="config-mbedtls-wifi.h"

# Disable TLS/DTLS protocol — WiFi uses only raw crypto primitives
CONFIG_MBEDTLS_TLS_VERSION_1_2=n
CONFIG_MBEDTLS_DTLS=n

# Disable all key exchanges — WiFi WPA2-Personal doesn't use TLS handshakes
CONFIG_MBEDTLS_KEY_EXCHANGE_ALL_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_DHE_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_DHE_RSA_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_ECJPAKE_ENABLED=n

# Disable extras not needed for WiFi
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=n
CONFIG_MBEDTLS_SERVER_NAME_INDICATION=n
CONFIG_MBEDTLS_SSL_EXTENDED_MASTER_SECRET=n
CONFIG_MBEDTLS_SSL_DTLS_CONNECTION_ID=n
CONFIG_MBEDTLS_GENPRIME_ENABLED=n
CONFIG_MBEDTLS_DEBUG=n

# ECC prerequisites (force-selected by WiFi driver, need curve + ASN1)
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y

# -------- wolfSSL (application TLS/DTLS backend for libcoap) --------
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_BLAKE2S=y
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_SETTINGS_FILE="config-wolfssl-libcoap.h"

# libcoap
CONFIG_LIBCOAP=y
CONFIG_LIBCOAP_CLIENT_SUPPORT=y

# Disable memory-intensive features
CONFIG_SHELL=n
CONFIG_PM=n
CONFIG_SMP=n